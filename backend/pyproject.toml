[project]
name = "claimready-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai-agents[litellm]>=0.7.0",
    "google-cloud-aiplatform>=1.71.0",
    "pydantic>=2.7.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
    "reportlab>=4.2.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "websockets>=16.0",
    "httpx>=0.28.1",
    "python-json-logger>=2.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires live Gemini API credentials",
    "smoke: opt-in live endpoint acceptance checks",
]
addopts = "--cov=. --cov-report=term-missing --cov-config=pyproject.toml -x"

[tool.coverage.run]
omit = [
    "tests/*",
    "data/*",
]
