# Builds & deploys both services to Cloud Run in one trigger.
#
# Substitutions (set on the Cloud Build trigger or via --substitutions):
#   _REGION         e.g. us-east1
#   _BACKEND_NAME   e.g. claimready-backend
#   _FRONTEND_NAME  e.g. claimready-frontend
#   _AR_REPO        e.g. claimready     (Artifact Registry repo, in _REGION)
#
# After the backend deploys, the second build uses the backend's URL as
# NEXT_PUBLIC_BACKEND_URL when building the frontend image (baked at build time).

substitutions:
  _REGION: us-east1
  _BACKEND_NAME: claimready-backend
  _FRONTEND_NAME: claimready-frontend
  _AR_REPO: claimready

steps:
# ─── 1. Build & push backend ──────────────────────────────────────────
- id: build-backend
  name: gcr.io/cloud-builders/docker
  args:
    - build
    - -t
    - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_BACKEND_NAME}:$BUILD_ID
    - -t
    - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_BACKEND_NAME}:latest
    - ./backend
- id: push-backend
  name: gcr.io/cloud-builders/docker
  args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_BACKEND_NAME}"]
  waitFor: [build-backend]

# ─── 2. Deploy backend ────────────────────────────────────────────────
- id: deploy-backend
  name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: gcloud
  args:
    - run
    - deploy
    - ${_BACKEND_NAME}
    - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_BACKEND_NAME}:$BUILD_ID
    - --region=${_REGION}
    - --platform=managed
    - --allow-unauthenticated
    - --cpu=2
    - --memory=2Gi
    - --timeout=600
    - --concurrency=8
    - --port=8080
    - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCP_REGION=${_REGION},AGENT_MODEL=vertex_ai/gemini-2.5-flash
  waitFor: [push-backend]

# ─── 3. Read backend URL into a workspace file ────────────────────────
- id: backend-url
  name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: bash
  args:
    - -c
    - |
      gcloud run services describe ${_BACKEND_NAME} \
        --region=${_REGION} --format='value(status.url)' > /workspace/backend_url
      echo "Backend URL: $(cat /workspace/backend_url)"
  waitFor: [deploy-backend]

# ─── 4. Build & push frontend (with backend URL baked in) ─────────────
- id: build-frontend
  name: gcr.io/cloud-builders/docker
  entrypoint: bash
  args:
    - -c
    - |
      BACKEND_URL=$(cat /workspace/backend_url)
      docker build \
        --build-arg NEXT_PUBLIC_BACKEND_URL=$$BACKEND_URL \
        -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_FRONTEND_NAME}:$BUILD_ID \
        -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_FRONTEND_NAME}:latest \
        ./frontend
  waitFor: [backend-url]
- id: push-frontend
  name: gcr.io/cloud-builders/docker
  args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_FRONTEND_NAME}"]
  waitFor: [build-frontend]

# ─── 5. Deploy frontend ───────────────────────────────────────────────
- id: deploy-frontend
  name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: gcloud
  args:
    - run
    - deploy
    - ${_FRONTEND_NAME}
    - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_FRONTEND_NAME}:$BUILD_ID
    - --region=${_REGION}
    - --platform=managed
    - --allow-unauthenticated
    - --cpu=1
    - --memory=512Mi
    - --timeout=60
    - --port=8080
  waitFor: [push-frontend]

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
